# CI/CD: testy -> DAST (ZAP) -> deploy Oracle (SSH) i/lub Azure.
# Oracle: Settings -> Secrets: ORACLE_SSH_PRIVATE_KEY; Variables: ORACLE_SSH_HOST.
# Azure OIDC: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_RG, AZURE_ACR
#   (infra/azure/README.md §5). DAST: dast.yml. Oracle SSH: infra/oci/README.md.
name: deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend – zależności, audyt, testy
        working-directory: backend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm test
      - name: Frontend – zależności, build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Skan obrazów (Trivy)
        run: |
          docker build -t fishing-api:ci backend
          docker build -t fishing-web:ci frontend
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fishing-api:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fishing-web:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  dast:
    needs: test
    uses: ./.github/workflows/dast.yml
    permissions:
      contents: read
    with:
      scan_oci_staging: ${{ github.event_name != 'pull_request' }}

  # VM Oracle (docker compose w /home/opc/app): git pull + rebuild po zaliczonym DAST.
  deploy-oracle:
    needs: [test, dast]
    if: github.event_name != 'pull_request' && vars.ORACLE_SSH_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy przez SSH (git pull + docker compose)
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ vars.ORACLE_APP_DIR }}
        with:
          host: ${{ vars.ORACLE_SSH_HOST }}
          username: ${{ vars.ORACLE_SSH_USER || 'opc' }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          port: ${{ vars.ORACLE_SSH_PORT || 22 }}
          envs: APP_DIR
          script_stop: true
          command_timeout: 25m
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/home/opc/app}"
            cd "$APP_DIR"
            git fetch origin
            git checkout master
            git pull --ff-only origin master
            # JWT_SECRET musi być w .env na serwerze (nie w Gicie)
            test -f .env
            grep -q '^JWT_SECRET=' .env
            grep -q '^PG_SSL=' .env || echo 'PG_SSL=disable' >> .env
            sudo docker compose up -d --build
            sudo docker compose ps
            # Frontend na tej VM mapuje host :80 -> kontener :8080
            for i in $(seq 1 40); do
              if curl -fsS http://127.0.0.1/healthz >/dev/null \
                 && curl -fsS http://127.0.0.1/api/tournaments >/dev/null; then
                echo "smoke OK after ${i} checks"
                exit 0
              fi
              sleep 3
            done
            echo "smoke timeout"; sudo docker compose logs --tail=80; exit 1

  deploy:
    needs: [test, dast]
    # Uruchamiaj wdrożenie tylko z mastera, gdy Azure jest skonfigurowany
    if: github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: production   # w GitHub: required reviewers = ręczna bramka przed wdrożeniem
    env:
      RG: ${{ vars.AZURE_RG }}
      ACR: ${{ vars.AZURE_ACR }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build obrazów w ACR
        run: |
          az acr build -r "$ACR" -t "fishing-api:$TAG" backend
          az acr build -r "$ACR" -t "fishing-web:$TAG" frontend

      - name: Migracje (job-release) – przed wdrożeniem nowej wersji
        run: |
          az containerapp job update -g "$RG" -n job-release --image "$ACR.azurecr.io/fishing-api:$TAG"
          az containerapp job start -g "$RG" -n job-release
          for i in $(seq 1 60); do
            STATUS=$(az containerapp job execution list -g "$RG" -n job-release --query "[0].properties.status" -o tsv)
            echo "status: $STATUS"
            [ "$STATUS" = "Succeeded" ] && exit 0
            [ "$STATUS" = "Failed" ] && exit 1
            sleep 10
          done
          echo "timeout"; exit 1

      - name: Rollout api i web
        run: |
          az containerapp update -g "$RG" -n api --image "$ACR.azurecr.io/fishing-api:$TAG"
          az containerapp update -g "$RG" -n web --image "$ACR.azurecr.io/fishing-web:$TAG"

      - name: Smoke test
        run: |
          FQDN=$(az containerapp show -g "$RG" -n web --query properties.configuration.ingress.fqdn -o tsv)
          curl -fsS -o /dev/null -w "web %{http_code}\n" "https://$FQDN/healthz"
          curl -fsS -o /dev/null -w "api %{http_code}\n" "https://$FQDN/api/tournaments"
